services:
  flutter:
    build:
      context: .
      dockerfile: docker/flutter/Dockerfile # ここを前述のNginx入りDockerfileに書き換え
    container_name: flutter_web
    ports:
      - "80:80" # 本番は80番でアクセス
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: postgres_db
    # network_mode: host は削除
    environment:
      POSTGRES_DB: university_app
      POSTGRES_USER: student
      POSTGRES_PASSWORD: password123
    volumes:
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d university_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_backend
    # network_mode: host は削除
    ports:
      - "8000:8000"
    environment:
      # localhost ではなく db (サービス名) を指定
      - DATABASE_URL=postgresql://student:password123@db:5432/university_app
      - SECRET_KEY=supersecretkey
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: